<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>UBS Digital</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to right, #cfd9df, #e2ebf0);
    }

    .card {
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      width: 320px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .icon {
      background: #2d6cdf;
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 15px;
      font-size: 22px;
    }

    h2 {
      color: #2d6cdf;
      margin-bottom: 5px;
    }

    p {
      font-size: 12px;
      color: #666;
      margin-bottom: 20px;
    }

    label {
      display: block;
      text-align: left;
      font-size: 12px;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 2px solid #2d6cdf;
      border-radius: 8px;
      margin-bottom: 10px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      background: #ccc;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button.active {
      background: #2d6cdf;
      color: white;
    }

    .footer {
      margin-top: 15px;
      font-size: 10px;
      color: #777;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">🔍</div>
    <h2>UBS Digital</h2>
    <p>Sistema de Gestão da Unidade Básica de Saúde</p>

    <label>CPF do Paciente</label>
    <input type="text" id="cpf" placeholder="000.000.000-00">

    <button id="btn">Entrar</button>

    <div class="footer">
      Acesso seguro e protegido • LGPD Compliance
    </div>
  </div>

  <script>
    const input = document.getElementById("cpf");
    const button = document.getElementById("btn");

    input.addEventListener("input", () => {
      if (input.value.length >= 11) {
        button.classList.add("active");
      } else {
        button.classList.remove("active");
      }
    });

    button.addEventListener("click", () => {
      if (input.value.length >= 11) {
        alert("Login realizado!");
      } else {
        alert("Digite um CPF válido!");
      }
    });
  </script>

</body>
</html>
