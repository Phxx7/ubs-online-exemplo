<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UBS Digital</title>
<style>
*{box-sizing:border-box;font-family:Arial, sans-serif}
body{margin:0;background:linear-gradient(135deg,#4facfe,#00f2fe);min-height:100vh}
.hidden{display:none}

/* AUTH */
.auth-container{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.container{background:white;width:100%;max-width:420px;padding:30px;border-radius:25px;box-shadow:0 15px 35px rgba(0,0,0,0.2)}
h1{text-align:center;margin-bottom:10px}
p.subtitle{text-align:center;color:gray;margin-bottom:20px}
input,select,button{width:100%;padding:12px;margin:8px 0;border:none;border-radius:15px;font-size:14px}
input,select{background:#f1f1f1}
button{background:#4facfe;color:white;font-weight:bold;cursor:pointer;transition:0.3s}
button:hover{opacity:0.85}
.link{text-align:center;margin-top:10px;color:#4facfe;cursor:pointer;font-size:14px}

/* DASHBOARD */
.dashboard{padding:20px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.logout{background:#ff6b6b}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.tab-btn{background:white;color:#4facfe;border:2px solid #4facfe;border-radius:20px;padding:8px 15px;cursor:pointer;font-weight:bold}
.tab-btn.active{background:#4facfe;color:white}
.card{background:white;padding:15px;border-radius:20px;margin-bottom:15px;box-shadow:0 5px 15px rgba(0,0,0,0.1)}
.flex{display:flex;gap:15px;flex-wrap:wrap}
.flex .card{flex:1;min-width:250px}

@media (min-width:768px){
.dashboard{max-width:1100px;margin:auto}
}
</style>
</head>
<body>

<!-- TELA INICIAL / LOGIN -->
<div class="auth-container" id="auth">
<div class="container">
<h1>🏥 UBS Digital</h1>
<p class="subtitle">Sistema online de atendimento das UBS</p>

<div id="loginForm">
<input type="email" id="loginEmail" placeholder="Email">
<input type="password" id="loginPassword" placeholder="Senha">
<button onclick="login()">Entrar</button>
<div class="link" onclick="toggleAuth()">Não tem conta? Cadastre-se</div>
</div>

<div id="registerForm" class="hidden">
<input type="text" id="registerName" placeholder="Nome Completo">
<input type="email" id="registerEmail" placeholder="Email">
<input type="password" id="registerPassword" placeholder="Senha">
<button onclick="register()">Cadastrar</button>
<div class="link" onclick="toggleAuth()">Já tem conta? Entrar</div>
</div>
</div>
</div>

<!-- DASHBOARD -->
<div class="dashboard hidden" id="dashboard">
<div class="header">
<h2>Painel do Paciente</h2>
<button class="logout" onclick="logout()">Sair</button>
</div>

<div class="tabs" id="tabs"></div>

<div id="content"></div>
</div>

<script>

const ubsData = {
"UBS CAIC": [
{name:"Dr. João Silva", specialty:"Clínico Geral"},
{name:"Dra. Ana Costa", specialty:"Pediatra"}
],
"UBS Bico Torto": [
{name:"Dr. Carlos Lima", specialty:"Cardiologista"},
{name:"Dra. Fernanda Alves", specialty:"Ginecologista"}
],
"UBS Bacural": [
{name:"Dr. Marcos Souza", specialty:"Ortopedista"},
{name:"Dra. Paula Mendes", specialty:"Dermatologista"}
]
};

function toggleAuth(){
document.getElementById('loginForm').classList.toggle('hidden');
document.getElementById('registerForm').classList.toggle('hidden');
}

function register(){
const name=document.getElementById('registerName').value;
const email=document.getElementById('registerEmail').value;
const password=document.getElementById('registerPassword').value;
if(!name||!email||!password) return alert('Preencha todos os campos');
localStorage.setItem(email,JSON.stringify({name,email,password,tickets:[]}));
alert('Cadastro realizado!');
toggleAuth();
}

function login(){
const email=document.getElementById('loginEmail').value;
const password=document.getElementById('loginPassword').value;
const user=JSON.parse(localStorage.getItem(email));
if(!user||user.password!==password) return alert('Credenciais inválidas');
localStorage.setItem('currentUser',email);
loadDashboard();
}

function logout(){
localStorage.removeItem('currentUser');
document.getElementById('dashboard').classList.add('hidden');
document.getElementById('auth').classList.remove('hidden');
}

function loadDashboard(){
document.getElementById('auth').classList.add('hidden');
document.getElementById('dashboard').classList.remove('hidden');

const tabsDiv=document.getElementById('tabs');
tabsDiv.innerHTML='';

Object.keys(ubsData).forEach((ubs,index)=>{
tabsDiv.innerHTML+=`<button class="tab-btn ${index===0?'active':''}" onclick="showUBS('${ubs}',this)">${ubs}</button>`;
});

showUBS(Object.keys(ubsData)[0],document.querySelector('.tab-btn'));
}

function showUBS(ubsName,btn){
document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');

const content=document.getElementById('content');
content.innerHTML='';

const doctors=ubsData[ubsName];

let html=`<div class="flex">`;

doctors.forEach(doc=>{
html+=`
<div class="card">
<h3>${doc.name}</h3>
<p>${doc.specialty}</p>
<button onclick="takeTicket('${ubsName}','${doc.name}')">Pegar Ficha</button>
</div>`;
});

html+=`</div>`;
content.innerHTML=html;
}

function takeTicket(ubs,doctor){
const email=localStorage.getItem('currentUser');
let user=JSON.parse(localStorage.getItem(email));
const ticket=`${ubs} - ${doctor} - ${new Date().toLocaleString()}`;
user.tickets.push(ticket);
localStorage.setItem(email,JSON.stringify(user));
alert('Ficha gerada com sucesso!');
}

window.onload=()=>{
if(localStorage.getItem('currentUser')) loadDashboard();
}

</script>

</body>
</html>
